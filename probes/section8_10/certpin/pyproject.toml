[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "certpin"
version = "0.9.4"
description = "Pins and validates vendor feed certificates."
requires-python = ">=3.9"
dependencies = [
    "tessaro-feeds>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["certpin*"]
