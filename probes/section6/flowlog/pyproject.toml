[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flowlog"
version = "0.4.2"
description = "Batches and ships structured log records to the ingest endpoint."
requires-python = ">=3.9"
dependencies = [
    "flowlog-internal-codecs>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["flowlog*"]
